name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        env:
          ENV: qa
          CI: true
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          PRACTICE_LOGIN_URL: ${{ vars.PRACTICE_LOGIN_URL }}
          PRACTICE_PAGE_URL: ${{ vars.PRACTICE_PAGE_URL }}
          CALENDAR_URL: ${{ vars.CALENDAR_URL }}
          ANGULAR_FORM_URL: ${{ vars.ANGULAR_FORM_URL }}
          PRODUCT_ID: ${{ vars.PRODUCT_ID }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          CLIENT_PASSWORD: ${{ secrets.CLIENT_PASSWORD }}
          PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }}
          PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/html-report/
          retention-days: 14
